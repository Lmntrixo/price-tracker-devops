
name: ci-cd pipeline for backend
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      
jobs:
#validate code and run tests
  validate-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'
          #use pip cache to speed up installation
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: install flake8
        run: |
            pip install flake8
      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      - name: Run tests  
        run: |
          pip install httpx && pytest

  build-and-push:
    runs-on: ubuntu-latest
    #uses permission to read and write for OIDC token to authenticate with aws
    permissions:
      contents: read
      id-token: write
    needs: validate-code
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Log in aws

        uses: aws-actions/configure-aws-credentials@v4
        with:
            role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
            aws-region: ${{ secrets.AWS_REGION }}

      - name: Build-docker image
        run: |
            docker build -t my-backend-app:${{ github.sha }} ./backend
        
      - name: scan vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: my-backend-app:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      # Push docker image to ECR
      - name: push image to ecr
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: tag and push image
        run: |
            docker tag my-backend-app:${{ github.sha }} ${{ steps.login-ecr.outputs.registry }}/my-backend-app:${{ github.sha }}
            docker push ${{ steps.login-ecr.outputs.registry }}/my-backend-app:${{ github.sha }}

  deploy-to-ec2:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Deploy to EC2
      #loging to aws
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: AWS SSM send command to deploy
        uses: zAbuQasem/ssm-run-command@v2
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          document-name: AWS-RunShellScript
          instance-ids: ${{ secrets.AWS_EC2_INSTANCE_ID }}
          wait-for-output: true
          command: |
              COMMAND=$(set -e
              export DEBIAN_FRONTEND=noninteractive
              # 1.updating repositories and install docker if not installed
              if ! command -v docker &> /dev/null; then
                 sudo apt update && sudo apt install -y docker.io docker-compose-v2
              fi

              #.create a repetory for prod
              mkdir -p /home/ubuntu/app
              cd /home/ubuntu/app

              # writing docker-compose.prod.yml file to the server
              sudo tee docker-compose.prod.yml > /dev/null << 'EOF'

              services:
                postgres:
                  image: postgres:16-alpine
                  container_name: tracker-postgres
                  env_file: .env
                  ports: 
                    - "5432:5432"
                  volumes:
                    - postgres_prod_data:/var/lib/postgresql/data
                  restart: always
                
                redis:
                  image: redis:7-alpine
                  container_name: tracker-redis
                  ports:
                    - "6379:6379"
                  volumes:
                    - redis_data:/data
                  restart: always

                backend:
                  image: ${AWS_ECR_BACKEND_URL}
                  container_name: tracker-prod-backend
                  ports:
                    - "8000:8000"
                  env_file: .env

                  depends_on:
                    - postgres
                    - redis
                  restart: always
                
                frontend:
                  image: ${AWS_ECR_FRONTEND_URL}
                  container_name: tracker-prod-frontend
                  ports:
                    - "80:8080"
                  
                  depends_on:
                    - backend
                  restart: always

              volumes:
                postgres_prod_data:
                redis_data:
              EOF

              # import secret password for postgres from ssm and write persistant envfile
              PGPASS=$(aws ssm get-parameter --name "/price-tracer/prod/POSTGRES_PASSWORD" --with-decryption --query "Parameter.Value" --output text --region eu-central-1 )
              sudo tee .env > /dev/null << EOF
              POSTGRES_PASSWORD=$PGPASS
              POSTGRES_USER=tracker_user
              POSTGRES_DB=tracker_db
              POSTGRES_HOST=postgres
              REDIS_HOST=redis
              REDIS_PORT=6379
              AWS_ECR_BACKEND_URL=${{ secrets.AWS_ECR_BACKEND_URL }}
              AWS_ECR_FRONTEND_URL=${{ secrets.AWS_ECR_FRONTEND_URL }}
              EOF


              #.log to ECR to download images

              aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS \
                --password-stdin ${{ secrets.AWS_ECR_BACKEND_URL}}
              # 3.create a repertory for production
              # mkdir -p /home/ubuntu/
              
              #4. download latest version of image and rerun the infrastructure
              #cd /home/ubuntu/app
              docker compose -f docker-compose.prod.yml pull
              docker compose -f docker-compose.prod.yml up -d --remove-orphans)
              echo $COMMAND

        


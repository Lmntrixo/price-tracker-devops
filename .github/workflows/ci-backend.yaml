
name: CI Backend
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      
jobs:
#validate code and run tests
  validate-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'
          #use pip cache to speed up installation
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: install flake8
        run: |
            pip install flake8
      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      - name: Run tests  
        run: |
          pip install httpx && pytest

  build-and-push:
    runs-on: ubuntu-latest
    #uses permission to read and write for OIDC token to authenticate with aws
    permissions:
      contents: read
      id-token: write
    needs: validate-code
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Log in aws

        uses: aws-actions/configure-aws-credentials@v4
        with:
            role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
            aws-region: ${{ secrets.AWS_REGION }}

      - name: Build docker images
        run: |
            docker build -t my-backend-app:${{ github.sha }} ./backend
        
      - name: scan vulnerabilities with trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: my-backend-app:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      # Push docker image to AWS ECR
      - name: push image to ecr
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: tag and push image
        run: |
            docker tag my-backend-app:${{ github.sha }} ${{ steps.login-ecr.outputs.registry }}/my-backend-app:${{ github.sha }}
            docker push ${{ steps.login-ecr.outputs.registry }}/my-backend-app:${{ github.sha }}

  